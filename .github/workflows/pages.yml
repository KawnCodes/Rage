# Publishes the game (the public/ folder) to GitHub Pages, which gives it an
# HTTPS address phones can save for offline play. Every push updates it, and
# phones pick the new version up next time they're online.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish game to GitHub Pages

on:
  push:
    branches: [main, claude/html5-pixel-rage-game-saeeyw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build the offline cache list
        run: node scripts/build-sw.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
